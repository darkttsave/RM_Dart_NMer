# 飞镖制导系统配置文件

camera:
  exposure: 4000
  gain: 10
  manual_exposure: true
  serial_number: "DA3694227"

debug_setting:
  debug: true
  show_tx_terminal: true

runtime_logging:
  terminal_line_limit: 500  # 代码启动时额外保存的终端日志行数

turn_control:
  turn_threshold: 4.0
  dist_far_thresh: 300.0
  dist_near_thresh: 100.0

detection:
  # P3 软件 ROI：默认关闭；原图像素坐标。
  roi:
    enabled: 0
    x: 0
    y: 0
    width: 0
    height: 0
  min_radius: 10
  max_radius: 30

  time_filter:
    required_frames: 5      # 连续识别到N帧后进入追踪状态
    required_lost_frames: 10  # 连续识别不到N帧后进入丢失状态
    max_center_dist: 100.0    # 中心点最大移动距离（像素），超出则重置计数

  bright_thresh: 80         # HSV V通道亮度阈值 (0-255)
  green_weight_thresh: 0.4    # 归一化绿色权重阈值 G/(R+G+B+1) (0.0-1.0)

  morphology:
    kernel_size: 7
    open_iterations: 1
    close_iterations: 3

  shape_filter:
    min_circularity: 0.6   # 圆形度阈值，矩形≈0.785以下会被过滤，建议0.5~0.7
    min_aspect_ratio: 0.5  # 外接矩形宽高比下限
    max_aspect_ratio: 2.0  # 外接矩形宽高比上限
    min_area: 50           # 轮廓最小面积（像素²）
    max_area: 5000        # 轮廓最大面积（像素²）

communication:
  port: "/dev/ttyACM0"
  baudrate: 115200
  yaw_timeout_ms: 1000  # 临时失联阈值；按电控实际发送周期协商调整
  watchdog: true  # true=发送失败时程序退出(配合watchdog.sh重启); false=切换模拟模式

# M1 Web 调试数据发布（独立后台线程；Flask/浏览器未连接时自动丢弃调试帧，不影响主链路）
web_debug:
  enabled: true          # false=完全关闭调试数据发布
  host: "127.0.0.1"      # Flask 调试数据接收地址（仅本机）
  port: 5010             # Flask 调试数据接收端口
  publish_fps: 0         # 预览发布频率：0=不主动限速（跟随算法帧率）；>0 为限速值
  jpeg_quality: 75       # 调试画面 JPEG 质量

# M2 数据录制（不依赖 Flask/浏览器；Flask 未启动或浏览器未打开时照常录制）
recording:
  enabled: true          # 录制系统总开关（--no-record 可覆盖）
  auto_start: false      # 程序启动不自动录制（预览调试时网页手动开始；无预览录制用 --auto-record 或 ./run_web_debug.sh --record-only）
  root: "recordings"     # 会话根目录（相对项目根），每次录制生成独立子目录
  record_image_mode: debug # 自动录像来源：debug 或 raw
  video_scale: 1         # 视频缩放：1=调试画面原尺寸（原实现固定 3 倍放大，无信息增益且 IO 大）
  video_fps: 30          # AVI 标称帧率（仅播放器默认速度；真实帧时间以 video_index_001.csv 为准）
  queue_capacity: 64     # 视频帧有界队列（满则丢帧并计入 session.json）
  control_port: 5011     # 本机录制控制口（仅 127.0.0.1；0=禁用），供网页 /api/recorder 转发

# P2-A：飞镖候选与轨迹（初始参数尚未实拍标定；关闭时沿用原有绿灯流程）
dart_detection:
  # P3 可选筛选默认关闭，阈值需实拍验证。
  roi:
    enabled: 0
    x: 0
    y: 0
    width: 0
    height: 0
  circularity:
    enabled: 0
    max: 0.8
  direction:
    enabled: 0
    points: 4
    min_displacement: 4.0
  # 基地录像约 55 秒的参考示例（1440×1080），实际相机须重新确认；不是落点。
  reference_line:
    enabled: 0
    x1: 600
    y1: 692
    x2: 840
    y2: 692
  window:
    enabled: 0
    delay_ms: 0
    duration_ms: 1000
    tracking_ms: 2000
  enabled: false
  draw_debug: true
  color: red                 # red 或 blue；不自动识别颜色
  saturation_min: 100        # HSV S/V 下限
  value_min: 80
  red_low_max: 10            # 红色 HSV 色相：0..red_low_max 和 red_high_min..179
  red_high_min: 170
  blue_hue_min: 90           # 蓝色色相范围
  blue_hue_max: 135
  min_area: 20               # 候选轮廓面积（像素²）
  max_area: 5000
  min_aspect: 0.15           # 外接矩形宽 / 高
  max_aspect: 8.0
  close_kernel: 3            # 闭运算核大小：正奇数
  max_distance: 120.0        # 最大逐帧关联距离（像素）
  min_motion: 4.0            # 建立轨迹所需最小移动（像素）
  max_lost_frames: 5
  max_track_points: 100
